<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="description" content="FoodX — Every order. Under control." />
    <meta property="og:title" content="FoodX" />
    <meta property="og:description" content="Every order. Under control." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/logo-lockup.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodX" />
    <meta name="twitter:description" content="Every order. Under control." />
    <meta name="twitter:image" content="/brand/logo-lockup.png" />
    <title>FoodX</title>
    <script>
      try {
        var m = localStorage.getItem('foodx.theme') || 'system'
        if (m === 'glass') {
          document.documentElement.classList.add('dark', 'glass')
        } else if (
          m === 'dark' ||
          (m === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
